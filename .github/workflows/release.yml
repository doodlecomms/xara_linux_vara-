name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bins:
    uses: ./.github/workflows/bins.yml

  source:
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends ca-certificates git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
      - run: scripts/release_deps.sh x86_64-unknown-linux-gnu
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: tag matches version
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"$/\1/p;T;q' Cargo.toml)
          test "${GITHUB_REF_NAME#v}" = "$ver"
      - run: cargo fetch --locked
      - run: scripts/release_tarball.sh HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: |
            target/dist/*.tar.xz
            target/dist/*.buildinfo
          if-no-files-found: error

  release:
    needs: [bins, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum -- *.tar.xz *.buildinfo | LC_ALL=C sort -k2 > SHA256SUMS
      - name: sums match the tag
        run: |
          git fetch -q --depth=1 origin "+$GITHUB_REF:$GITHUB_REF"
          git for-each-ref --format='%(contents)' "$GITHUB_REF" | grep -E '^[0-9a-f]{64}  xara-' > tag-sums
          diff tag-sums out/SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.tar.xz
            out/*.buildinfo
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=${GITHUB_REF_NAME#v}
          awk -v h="## $ver" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "xara $ver" --notes-file notes.md out/*
