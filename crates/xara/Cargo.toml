[package]
name = "xara"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "A VARA-compatible HF/FM modem and passive monitor for Linux, FreeBSD and macOS."

[dependencies]
xara-phy.workspace = true
xara-arq.workspace = true
xara-host.workspace = true
xara-ui.workspace = true
libc.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
alsa-sys = { workspace = true, optional = true }

[dev-dependencies]
xara-testkit.workspace = true

[features]
default = ["pulse", "alsa"]
pulse = []
alsa = ["dep:alsa-sys"]
registered = []
trusdx = []
fixed-turbo = ["xara-phy/fixed-turbo"]
float-turbo = ["xara-phy/float-turbo"]
